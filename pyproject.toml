[project]
name = "xray"
version = "0.1.0"
description = "X Ray — score de financiabilidad para pymes a partir de datos de tesorería (HackSpain 2026, reto de Embat)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "lightgbm>=4.5",
    "shap>=0.46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "nbstripout>=0.7",
]
gpu = [
    "torch>=2.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
xray-cache = "xray.data:main"
xray-evals = "xray.evals:main"
xray-score = "xray.score:main"
xray-features = "xray.features:main"
xray-export-web = "xray.export_web:main"
xray-testsets = "xray.testsets:main"
xray-demopacks = "xray.demopacks:main"
xray-prescore-packs = "xray.prescore:main"
xray-api = "api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xray", "api"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = ["web", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/tmp", ".git", ".venv", "artifacts", "web", "notebooks"]
markers = [
    "unit: pure logic (T1/T2)",
    "integration: seams and HTTP",
    "adversarial: abuse of own interfaces",
    "evals: wraps external eval suites",
    "regression: named defect pins",
    "legacy: superseded packages (deselected by default)",
    "slow: expensive or optional",
]
addopts = "-m 'not legacy and not evals'"

[tool.coverage.run]
source = ["xray", "api"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # CLI generators — exercised by hand / demopack integration, not unit-covered.
    "xray/demopacks.py",
    "xray/testsets.py",
]

[tool.coverage.report]
# Core seams (score, features, rules, unify, api ingest). Climb toward 100 as CLI
# branches and projection edge cases get adversarial tests.
fail_under = 90
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
