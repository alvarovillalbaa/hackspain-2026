[project]
name = "hackspain-2026"
version = "0.1.0"
description = "Explainable monthly treasury resilience scoring for HackSpain 2026"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "seaborn>=0.13.2",
]

[project.scripts]
xray-score = "xray_score.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_score"]
