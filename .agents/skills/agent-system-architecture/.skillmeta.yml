id: engineering.agent-system-architecture
name: agent-system-architecture
origin:
  repo: alvarovillalbaa/plugins
  branch: main
  path: engineering/skills/agent-system-architecture
install:
  mode: project-managed-copy
  agents:
    - codex
    - cursor
    - openclaw
    - claude-code
personalization:
  policy: overlay-only
  local_files:
    - personalize.local.yml
    - "*.local.yml"
    - .overlays/**
    - .generated/**
    - .company/**
    - .user/**
upstream_contribution:
  allowed_paths:
    - .skillmeta.yml
    - SKILL.md
    - README.md
    - agents/**
    - scripts/**
    - references/**
    - templates/**
    - examples/**
    - hooks/**
    - personalization.schema.json
    - personalize.example.yml
    - evals/**
  forbidden_paths:
    - personalize.local.yml
    - "*.local.yml"
    - .overlays/**
    - .generated/**
    - .company/**
    - .user/**
    - generated/**
    - private/**
quality_gates:
  require_eval: false
  require_diff_classification: true
  require_human_review: true
