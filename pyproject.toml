[project]
name = "xray"
version = "0.1.0"
description = "X Ray — score de financiabilidad para pymes a partir de datos de tesorería (HackSpain 2026, reto de Embat)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "nbstripout>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
xray-cache = "xray.data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xray"]

[tool.ruff]
line-length = 100
extend-exclude = ["web", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
